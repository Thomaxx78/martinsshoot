function insights(){const sh=S.shoots;if(!sh.length)return`<p class="mu">No data yet. Add past shoots to start your statistics.</p>`;const m={},mt={},pm={};sh.forEach(s=>{const c=s.country||"Unknown";m[c]=m[c]||{n:0,r:0};m[c].n++;m[c].r+=+s.amount||0;if(s.date){const k=s.date.slice(0,7);mt[k]=(mt[k]||0)+(+s.amount||0)}const p=s.method||"unknown";pm[p]=(pm[p]||0)+1});
const e=Object.entries(m),byN=[...e].sort((a,b)=>b[1].n-a[1].n),byR=[...e].sort((a,b)=>b[1].r-a[1].r),st=stats(),o=sel&&m[sel],tot=sh.length;let acc=0;const dn=byN.slice(0,6).map(([k,x],i)=>{const a=acc/tot*100;acc+=x.n;return`hsl(${150+i*40},45%,45%) ${a}% ${acc/tot*100}%`});if(acc<tot)dn.push(`var(--bd) ${acc/tot*100}% 100%`);const mk=Object.entries(mt).sort(),mm=Math.max(1,...mk.map(x=>x[1]));
return`<div class="g2"><div class="k"><div class="st">${st?cs()+st.avg.toFixed(2):"—"}</div>Average contribution</div><div class="k"><div class="st">${st?cs()+st.med.toFixed(2):"—"}</div>Median</div></div><h3>Where customers are from</h3>${worldMap(m)}<div><button class="b sm s" onclick="mz=Math.min(8,mz*2);render()">Zoom +</button><button class="b sm s" onclick="mz=Math.max(1,mz/2);render()">Zoom −</button><button class="b sm s" onclick="mz=1;sel=null;render()">Reset</button></div><p class="mu" style="font-size:.8rem">Simplified map. Bubble size = customers. Tap a bubble or country.</p><div>${byN.map(([k,x])=>`<button class="b sm ${k===sel?"":"s"}" data-k="${esc(k)}" onclick="sel=this.dataset.k;render()">${esc(k)} ${x.n}</button>`).join("")}</div>${o?`<div class="k"><h3>${esc(sel)}</h3>${o.n} customers · ${cs()}${o.r} total · ${cs()}${(o.r/o.n).toFixed(2)} average</div>`:""}
<div class="k"><h3>Contributions over time</h3>${lineChart()}</div><div class="k"><h3>Revenue by month</h3>${mk.length?`<div style="display:flex;gap:6px;align-items:flex-end;height:110px">${mk.map(([k,v])=>`<div style="flex:1;text-align:center;font-size:.65rem"><div class="bar" style="height:${v/mm*90}px" title="${cs()}${v}"></div>${k.slice(2)}</div>`).join("")}</div>`:`<p class="mu">No dated entries yet.</p>`}</div><div class="k"><h3>How much people contribute</h3>${st?hist(st.a):"<p class=\"mu\">No amounts yet.</p>"}</div><div class="k"><h3>Customers by country</h3><div style="width:140px;height:140px;border-radius:50%;margin:8px auto;background:conic-gradient(${dn.join(",")})"></div>${byN.slice(0,6).map(([k,x],i)=>`<div class="row"><span><span style="color:hsl(${150+i*40},45%,45%)">●</span> ${esc(k)}</span><b>${x.n}</b></div>`).join("")}</div><div class="k"><h3>Revenue by country</h3>${hb(byR.map(([k,x])=>[k,x.r]),v=>cs()+v)}</div><div class="k"><h3>Payment methods</h3>${hb(Object.entries(pm),v=>v)}</div>`}
let eid=null;
function editS(id){eid=id;tab="edit";render();window.scrollTo(0,0)}
function editForm(){const s=S.shoots.find(x=>x.id===eid);if(!s)return"";const f=(k,l,ty)=>`<label>${l}</label><input id="e_${k}" ${ty||""} value="${esc(s[k])}">`;return`<div class="k"><h3>Edit customer</h3>${f("name","Name")}${f("date","Date",'type="date"')}${f("phone","WhatsApp")}${f("email","Email")}${f("country","Country",'list="cl2"')}${f("amount","Amount",'type="number" inputmode="decimal"')}${f("photos","Photos",'type="number"')}${f("link","Drive link")}<label>Payment method</label><select id="e_method">${["revolut","paypal","card","cash","past",""].map(x=>`<option value="${x}" ${s.method===x?"selected":""}>${x||"—"}</option>`).join("")}</select><label>Status</label><select id="e_status">${["paid","pending","cash due"].map(x=>`<option ${s.status===x?"selected":""}>${x}</option>`).join("")}</select><label>Notes</label><textarea id="e_notes">${esc(s.notes)}</textarea><button class="b" onclick="saveE()">Save changes</button><button class="b g" onclick="tab='customers';render()">Cancel</button><button class="b g" onclick="delE()">Delete customer</button></div><datalist id="cl2">${CO.map(c=>`<option>${c}</option>`).join("")}</datalist>`}
function saveE(){const s=S.shoots.find(x=>x.id===eid),g=k=>$("e_"+k).value.trim();["name","date","phone","email","country","link","notes","method","status"].forEach(k=>s[k]=g(k));s.amount=+g("amount")||0;s.photos=+g("photos")||0;s.lang=langFor(s.country);save();tab="customers";render()}
function delE(){if(confirm("Delete this customer?")){S.shoots=S.shoots.filter(x=>x.id!==eid);save();tab="customers";render()}}
function render2(){$("cl").innerHTML=cl(S.shoots.filter(s=>JSON.stringify(s).toLowerCase().includes(q.toLowerCase())).reverse())}
function markPaid(id){S.shoots.find(s=>s.id===id).status="paid";save();render()}
function rv(id){S.shoots.find(s=>s.id===id).reviewSent=1;save()}
function upl(k,el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.settings[k]=r.result;save();render()};r.readAsDataURL(f)}
function saveSet(){const s=S.settings;["drive","review","stripe","stripeUrl","cur","lang","pin"].forEach(k=>{const e=$("s_"+k);if(e)s[k]=e.value.trim()});if(!s.pin)s.pin="1234";save();alert("Saved");render()}
function addPast(){const g=i=>$(i).value.trim(),f=["pd","pn","pc","pa","pp","pt"];if(!f.some(i=>g(i)))return $("pmsg").textContent="Enter at least one detail.";S.shoots.push({id:"h"+Date.now()+Math.random(),ref:"PAST",date:g("pd"),name:g("pn")||"Past customer",country:g("pc"),amount:+g("pa")||0,photos:+g("pp")||0,notes:g("pt"),status:"paid",method:"past",lang:"en"});save();f.forEach(i=>$(i).value="");$("pmsg").textContent="Saved. Add another, or check Insights."}
function csv(){const c=["ref","date","name","country","phone","email","amount","method","status","photos","link","notes"],r=[c.join(",")].concat(S.shoots.map(s=>c.map(k=>`"${String(s[k]??"").replace(/"/g,'""')}"`).join(",")));const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([r.join("\n")],{type:"text/csv"}));a.download="shoots.csv";a.click()}
// ---------- shoot flow ----------
function newShoot(){go("hand");}
function hand(){return`<h2>Photos for this shoot</h2><p class="mu">Choose the edited photos, then hand the phone to the customer.</p><input id="ph" type="file" accept="image/*" multiple onchange="pick(this)"><div id="pc2" class="mu">${files.length?files.length+" selected":""}</div><button class="b" onclick="start()">Hand to customer</button><button class="b g" onclick="go('home')">Cancel</button>`}
function pick(el){files=[...el.files];urls=files.map(f=>URL.createObjectURL(f));$("pc2").textContent=files.length+" selected"}
function start(){if(!files.length)return alert("Select photos first");L=S.settings.lang;cur={};v="x";$("app").innerHTML=`<div class="c fade" style="padding-top:22vh"><h1>${t("ready")}</h1><p class="mu">${t("sub")}</p><button class="b" onclick="go('det')">${t("look")}</button></div>`}
function lsw(){return`<div style="text-align:right">${["en","fr","es"].map(l=>`<button class="b sm ${l===L?"":"s"}" onclick="L='${l}';render()">${l.toUpperCase()}</button>`).join("")}</div>`}
function det(){const c=cur;return lsw()+`<h2>${t("we")}</h2><label>${t("name")}</label><input id="n" value="${esc(c.name)}"><label>${t("wa")}</label><input id="p" type="tel" value="${esc(c.phone)}"><label>${t("em")}</label><input id="e" type="email" value="${esc(c.email)}"><label>${t("co")}</label><input id="c" list="cl3" value="${esc(c.country)}"><datalist id="cl3">${CO.map(x=>`<option>${x}</option>`).join("")}</datalist><label style="display:flex;gap:10px;align-items:flex-start;color:var(--tx)"><input type="checkbox" id="pm" style="width:24px;margin:2px 0" ${c.perm?"checked":""}><span>${t("perm")} — ${t("yes")}</span></label><p id="er" class="mu"></p><button class="b" onclick="submitDet()">${t("show")}</button>`}
function submitDet(){const c=cur;c.name=$("n").value.trim();c.phone=$("p").value.trim();c.email=$("e").value.trim();c.country=$("c").value.trim();c.perm=$("pm").checked;if(!c.name||!c.country||(!c.phone&&!c.email)){$("er").textContent=t("need");return}
const n=S.shoots.length+1,id="s"+Date.now();c.id=id;c.ref="REF-"+String(n).padStart(6,"0");c.date=today();c.lang=langFor(c.country);c.photos=files.length;c.status="pending";c.amount=0;
const fid=Math.random().toString(36).slice(2,12);c.folder=`${c.name} – ${c.date} – ${c.ref}`;c.link="https://drive.google.com/drive/folders/"+fid+"?usp=sharing";go("gal")}
function gal(){return lsw()+`<div class="gal">${urls.map(u=>`<div><img src="${u}" alt=""></div>`).join("")}<div><h2>${t("all")(urls.length)}</h2><button class="b" onclick="go('deliv')">${t("get")}</button></div></div>`}
function deliv(){const c=cur,m=T[c.lang].msg(c.link);return lsw()+`<h2>${t("deliv")}</h2>${c.phone?`<a class="b" target="_blank" href="https://wa.me/${c.phone.replace(/\D/g,"")}?text=${encodeURIComponent(m)}">${t("swa")}</a>`:""}${c.email?`<a class="b s" href="mailto:${esc(c.email)}?subject=${encodeURIComponent(c.folder)}&body=${encodeURIComponent(m)}">${t("sem")}</a>`:""}<button class="b s" onclick="cur.showQr=1;render()">${t("sqr")}</button><div id="qr" class="qr c"></div><button class="b" onclick="go('amt')">${t("go")}</button>`}
function amt(){const st=stats();return lsw()+`<h1>${t("contr")}</h1><p class="mu">${t("ch")}</p><div style="display:flex;align-items:center;gap:8px"><b style="font-size:1.6rem">${cs()}</b><input id="am" type="number" inputmode="decimal" placeholder="0" style="font-size:1.4rem" value="${cur.amount||""}"></div><button class="b s" onclick="$('gd').hidden=!$('gd').hidden">${t("ns")}</button><div id="gd" class="k" hidden><p>${t("guide")}</p>${st?`<p><b>${t("avg")}: ${cs()}${st.avg.toFixed(2)}</b>${st.a.length>=3?`<br><b>${t("rng")}: ${cs()}${st.lo.toFixed(2)}–${st.hi.toFixed(2)}</b>`:""}</p>${hist(st.a)}`:`<p class="mu">—</p>`}<p>${t("wel")}</p></div><button class="b" onclick="toPay()">${t("go")}</button>`}
function hist(a){const mn=a[0],mx=a[a.length-1],n=6,w=(mx-mn)/n||1,b=Array(n).fill(0);a.forEach(x=>b[Math.min(n-1,Math.floor((x-mn)/w))]++);const m=Math.max(...b);return`<div style="display:flex;gap:4px;align-items:flex-end;height:80px">${b.map(x=>`<div class="bar" style="height:${x/m*100}%"></div>`).join("")}</div><div class="mu" style="display:flex;justify-content:space-between;font-size:.8rem"><span>${cs()}${mn.toFixed(2)}</span><span>${cs()}${mx.toFixed(2)}</span></div>`}
function toPay(){const a=parseFloat($("am").value);if(!(a>0))return;cur.amount=a;go("pay")}
function pay(){const s=S.settings,m=cur.method;let d="";
if(m==="revolut"||m==="paypal"){const i=s[m];d=`<div class="k c qr">${i?`<img src="${i}" alt="QR">`:`<p class="mu">No QR uploaded. Add it in Settings.</p>`}<p><b>${cs()}${cur.amount}</b></p><button class="b" onclick="fin()">${t("done").split(" —")[0]} ✓</button></div>`}
if(m==="card")d=`<div class="k c"><div class="st">${cs()}${cur.amount}</div>${s.stripeUrl?`<a class="b" target="_blank" href="${esc(s.stripeUrl)}">Open Stripe</a>`:`<p class="mu">Open the Stripe app, enter this amount, then tap the card on this phone.</p>`}<button class="b s" onclick="fin()">Payment completed</button></div>`;
return lsw()+`<h1>${t("ty")}</h1><p class="mu">${t("how")}</p><button class="b ${m==="revolut"?"":"s"}" onclick="cur.method='revolut';render()">Revolut / Apple Pay / Google Pay</button><button class="b ${m==="paypal"?"":"s"}" onclick="cur.method='paypal';render()">PayPal</button><button class="b ${m==="card"?"":"s"}" onclick="cur.method='card';render()">${t("card")}</button>${d}<button class="b g" onclick="cur.method='cash';fin()">${t("cash")}</button>`}
function fin(){const c=cur;c.status=c.method==="cash"?"cash due":"paid";c.reviewDue=Date.now()+20*60000;S.shoots.push({id:c.id,ref:c.ref,date:c.date,name:c.name,phone:c.phone,email:c.email,country:c.country,lang:c.lang,perm:c.perm,photos:c.photos,link:c.link,folder:c.folder,amount:c.amount,method:c.method,status:c.status,reviewDue:c.reviewDue});save();go("end")}
function end(){setTimeout(()=>{if(v==="end"){files=[];urls=[];cur=null;go("home")}},4000);return`<div class="c" style="padding-top:18vh"><div class="chk">✓</div><h2>${t("done")}</h2></div>`}
render();
</script></body></html>
